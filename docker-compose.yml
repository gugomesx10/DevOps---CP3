services:
  db:
    image: mysql:8.0
    container_name: devops_cp3_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cp3devops
      MYSQL_DATABASE: devops_cp3
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cp3_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcp3devops"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devops_cp3_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_NAME: devops_cp3
      DB_USER: root
      DB_PASS: cp3devops
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cp3_network

volumes:
  db_data:

networks:
  cp3_network:
    driver: bridge
